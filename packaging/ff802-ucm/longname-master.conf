# Master UCM file for one RME Fireface 802 (CC mode), package ff802-ucm-profile.
#
# ff802-ucm-bind links this file as
#   /usr/share/alsa/ucm2/conf.d/USB-Audio/<card long name>.conf
# ucm.conf probes that path before USB-Audio.conf. This is the workaround
# for alsa-lib < 1.2.16, which never loads the optional include
# USB-Audio/conf.d/0424-3fdd.conf (fixed upstream in commit 62c24074).
#
# It replaces USB-Audio.conf for this card only and does the same as
# USB-Audio.conf would: default SplitPCM period time, our conf.d file
# (selects the profile, refuses the Fireface 802 FS), then the profile.

Syntax 8

Define.ProfileName ""
Define.SplitPCMPeriodTime 10000		# 10 ms, as in USB-Audio.conf

If.env1 {
	Condition {
		Type String
		Empty "$${env:UCM_USB_PERIOD_TIME}"
	}
	False.Define.SplitPCMPeriodTime "${env:UCM_USB_PERIOD_TIME}"
}

Include.ff802.File "/USB-Audio/conf.d/0424-3fdd.conf"

If.inc {
	Condition {
		Type String
		Empty "${var:ProfileName}"
	}
	True.Error "UCM is not supported for this USB device (${CardLongName} @ ${CardComponents})"
	False.Include.prof.File "/USB-Audio/${var:ProfileName}.conf"
}
