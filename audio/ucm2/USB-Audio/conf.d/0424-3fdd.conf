# RME Fireface 802 (original model) in class compliant mode, USB 0424:3fdd
#
# Included by USB-Audio/USB-Audio.conf via its optional
# "/USB-Audio/conf.d/${var:USBID1}-${var:USBID2}.conf" hook, which is
# evaluated before the "UCM is not supported" check.
#
# The USB ID uses the Microchip vendor id (same scheme as the Fireface UCX,
# 0424:3fb9). As an extra safeguard the profile is only selected if the card
# long name identifies the original Fireface 802 and not the Fireface 802 FS.
# If the name does not match, no profile is defined and alsa-lib reports
# "UCM is not supported", i.e. the card keeps its non-UCM profiles.

If.ff802 {
	Condition {
		Type String
		Haystack "${CardLongName}"
		Needle "Fireface 802"
	}
	True.If.ff802fs {
		Condition {
			Type String
			Haystack "${CardLongName}"
			Needle "802 FS"
		}
		False.Define.ProfileName "RME/Fireface-802"
	}
}
