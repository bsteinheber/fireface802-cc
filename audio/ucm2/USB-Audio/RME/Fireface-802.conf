Comment "Fireface 802"

# The Fireface 802 in class compliant mode provides 22 playback and 22
# capture channels (S24_3LE, 44.1 to 192 kHz; a 2 channel playback and a
# 12 channel capture alternate setting exist as well).
#
# FF802-CHANNEL-MAP: UNVERIFIED
# The assignment below is the expected layout and has NOT yet been confirmed
# by measurement on real hardware. In class compliant mode the routing may
# also depend on the mixer state stored in the device.
#
# Expected playback channels (USB channel index, zero based):
# - channels  0 to  7 are analog line outputs 1 to 8
# - channels  8 and  9 are headphones output 1 (outputs 9/10)
# - channels 10 and 11 are headphones output 2 (outputs 11/12)
# - channels 12 and 13 are AES/EBU
# - channels 14 to 21 are ADAT Optical Interface (8 channels)
#
# Expected capture channels (USB channel index, zero based):
# - channels  0 to  7 are analog line inputs 1 to 8
# - channels  8 to 11 are front microphone / instrument inputs 9 to 12
# - channels 12 and 13 are AES/EBU
# - channels 14 to 21 are ADAT Optical Interface (8 channels)
#
# Only the most common stereo devices are exposed. AES/EBU, ADAT and the
# remaining inputs stay accessible through the "pro-audio" profile.

SectionUseCase."HiFi" {
	Comment "Default"
	File "/USB-Audio/RME/Fireface-802-HiFi.conf"
}
