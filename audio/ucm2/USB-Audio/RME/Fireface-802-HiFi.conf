Include.pcm_split.File "/common/pcm/split.conf"

# FF802-CHANNEL-MAP: UNVERIFIED
# All Channel0/Channel1 assignments in this file follow the expected layout
# documented in Fireface-802.conf and are not yet confirmed on hardware.
#
# This profile exposes six independent stereo playback devices (all analog
# line outputs and both headphones outputs) and one stereo capture device.
# All devices share the 22 channel hardware PCM through SplitPCM, so they
# can be used at the same time. AES/EBU, ADAT and further inputs are not
# exposed here; use the "pro-audio" profile for them.

Macro [
	{
		SplitPCM {
			Name "ff802_stereo_out"
			Direction Playback
			Format S24_3LE
			Channels 2
			HWChannels 22
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
			HWChannelPos14 FL
			HWChannelPos15 FR
			HWChannelPos16 FL
			HWChannelPos17 FR
			HWChannelPos18 FL
			HWChannelPos19 FR
			HWChannelPos20 FL
			HWChannelPos21 FR
		}
	}
	{
		SplitPCM {
			Name "ff802_stereo_in"
			Direction Capture
			Format S24_3LE
			Channels 2
			HWChannels 22
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
			HWChannelPos14 FL
			HWChannelPos15 FR
			HWChannelPos16 FL
			HWChannelPos17 FR
			HWChannelPos18 FL
			HWChannelPos19 FR
			HWChannelPos20 FL
			HWChannelPos21 FR
		}
	}
]

# Headphones outputs (preferred default: Headphones 1)

SectionDevice."Headphones 1" {
	Comment "Headphones Output 9/10"

	Value {
		PlaybackPriority 255
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "ff802_stereo_out"
		Direction Playback
		HWChannels 22
		Channels 2
		Channel0 8
		Channel1 9
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Headphones 2" {
	Comment "Headphones Output 11/12"

	Value {
		PlaybackPriority 200
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "ff802_stereo_out"
		Direction Playback
		HWChannels 22
		Channels 2
		Channel0 10
		Channel1 11
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

